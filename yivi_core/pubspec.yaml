name: yivi_core
description: "Yivi core components"
version: 0.0.1

publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.3.0"

dependencies:
  pinput: ^6.0.2
  intl_phone_number_input: ^0.7.5
  plugin_platform_interface: ^2.0.2
  flutter:
    sdk: flutter

  # The Material and Cupertino widget libraries, unbundled from the core SDK in
  # Flutter 3.47. They carry the localization delegates flutter_localizations
  # used to provide.
  material_ui: ^1.0.0
  cupertino_ui: ^1.0.0

  sentry_flutter: ^9.8.0
  go_router: ^18.0.0
  string_similarity: ^2.1.1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.3
  flutter_svg: ^2.0.7
  flutter_i18n: ^0.37.1
  flutter_bloc: ^7.2.0
  equatable: ^2.0.3
  email_validator: ^3.0.0
  url_launcher: ^6.0.10
  flutter_web_auth_2: ^5.0.3
  json_annotation: ^4.9.0
  rxdart: ^0.28.0
  package_info_plus: ^10.1.0
  collection: ^1.18.0
  share_plus: ^13.1.0
  intl: ^0.20.2
  # The maintained fork of flutter_markdown, which the Flutter team
  # discontinued at 0.7.7+1. Still reads the core SDK ThemeData, so it needs
  # LegacyMaterialBridge; the maintainer has said material_ui support is coming.
  flutter_markdown_plus: ^1.0.12
  async: ^2.11.0
  streaming_shared_preferences: ^2.0.0
  visibility_detector: ^0.4.0+2
  quiver: ^3.0.1
  timeline_tile: ^2.0.0
  lottie: ^3.1.3
  permission_handler: ^13.0.1
  flutter_riverpod: ^3.2.0
  local_auth: ^3.0.1
  http: ^1.5.0
  altcha_lib: ^0.3.0
  mrz_parser:
    git:
      url: https://github.com/privacybydesign/mrz_parser
      ref: v3.0.0
  camera: ^0.12.0+1
  camera_platform_interface: ^2.2.2
  vcmrtd:
    git:
      url: https://github.com/privacybydesign/vcmrtd.git
      ref: v4.1.0
      path: vcmrtd
  mask_text_input_formatter: ^2.9.0
  # Temporary forks because their original repos are not compatible with new android api's.
  # Should be reverted back to their published version when they're made compatible.
  native_device_orientation:
    git:
      url: https://github.com/privacybydesign/flutter_native_device_orientation

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.11.0
  # Test-only: keyshare_lock_test.dart uses SharedPreferences.setMockInitialValues.
  # Runtime code uses streaming_shared_preferences (which pulls this in transitively).
  shared_preferences: ^2.0.7
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  build_runner: ^2.10.5
  flutter_launcher_icons: ^0.14.1

# altcha_lib pulls pointycastle from pub.dev, but vcmrtd pulls it from the
# privacybydesign/pc-dart fork; pub cannot unify a hosted and a git source for
# the same package. Force the fork (it reports version 4.0.0, satisfying
# altcha_lib's ^4.0.0). Our pinned PBKDF2/SHA-256 path uses package:crypto, not
# pointycastle, so the fork is not on the ALTCHA hot path.
dependency_overrides:
  pointycastle:
    git:
      url: https://github.com/privacybydesign/pc-dart.git
      ref: master

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/locales/
    - assets/arrow_back/
    - assets/enrollment/
    - assets/error/
    - assets/help/
    - assets/help/mobile_login/
    - assets/help/computer_login/
    - assets/reset/
    - assets/non-free/
    - assets/disclosure/
    - assets/ui/
    - assets/success/
    - assets/vehicles/

  fonts:
    - family: Alexandria
      fonts:
        - asset: fonts/alexandria/Alexandria-Thin.ttf
          weight: 100
        - asset: fonts/alexandria/Alexandria-ExtraLight.ttf
          weight: 200
        - asset: fonts/alexandria/Alexandria-Light.ttf
          weight: 300
        - asset: fonts/alexandria/Alexandria-Regular.ttf
          weight: 400
        - asset: fonts/alexandria/Alexandria-Medium.ttf
          weight: 500
        - asset: fonts/alexandria/Alexandria-SemiBold.ttf
          weight: 600
        - asset: fonts/alexandria/Alexandria-Bold.ttf
          weight: 700
        - asset: fonts/alexandria/Alexandria-ExtraBold.ttf
          weight: 800
        - asset: fonts/alexandria/Alexandria-Black.ttf
          weight: 900
    - family: Open Sans
