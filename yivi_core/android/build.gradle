group = "foundation.privacybydesign.yivi_core"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.3.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.3.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// The schemes in irma_configuration/ are git submodules, which `git clone`
// without --recursive and `git worktree add` leave empty, and bind_go.sh links
// them into the assets. Without them the app builds fine but cannot start
// ("expected default keyshare scheme pbdf could not be found in
// configuration"), so stop the build instead. Same check as
// check_irma_configuration.sh, in Groovy so it also runs on Windows.
def irmaRepoRoot = file("${projectDir}/../..")
def irmaAssets = file("${projectDir}/src/main/assets/irma_configuration")
def checkIrmaConfiguration = tasks.register("checkIrmaConfiguration") {
    doLast {
        def gitmodules = new File(irmaRepoRoot, ".gitmodules")
        def schemes = gitmodules.readLines()
                .collect { it.trim() }
                .findAll { it.startsWith("path = irma_configuration/") }
                .collect { it.substring("path = irma_configuration/".length()) }
        def notCheckedOut = schemes.findAll { !new File(irmaRepoRoot, "irma_configuration/${it}/index").exists() }
        if (!notCheckedOut.isEmpty()) {
            throw new GradleException(
                    "These schemes in irma_configuration/ are not checked out: ${notCheckedOut.join(', ')}.\n" +
                    "They are git submodules, which 'git clone' without --recursive and 'git worktree add' leave empty.\n" +
                    "An app built without them cannot start. Check them out with:\n\n" +
                    "    git -C \"${irmaRepoRoot.canonicalPath}\" submodule update --init\n")
        }
        def notLinked = schemes.findAll { !new File(irmaAssets, "${it}/index").exists() }
        if (!notLinked.isEmpty()) {
            throw new GradleException(
                    "The schemes are not linked into the Android assets (${irmaAssets}).\n" +
                    "An app built without them cannot start. Build the Go bridge, which also links them:\n\n" +
                    "    ./bind_go.sh android\n")
        }
    }
}
// On the asset merge, not preBuild: the JVM unit tests and the Go bridge build
// in CI do not need the schemes and run without the submodules.
tasks.matching { it.name ==~ /merge.*Assets/ }.configureEach { dependsOn(checkIrmaConfiguration) }

android {
    namespace = "foundation.privacybydesign.yivi_core"

    compileSdk = 37

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/java"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 26
    }

    dependencies {
        testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
        testRuntimeOnly("org.junit.platform:junit-platform-launcher")
        // 5.0.0 ships byte-buddy 1.12, which cannot read JDK 21 class files.
        testImplementation("org.mockito:mockito-core:5.23.0")

        implementation files('irmagobridge/irmagobridge.aar')
        implementation "androidx.browser:browser:1.3.0"
        implementation "com.scottyab:rootbeer-lib:0.1.1"

        androidTestImplementation 'androidx.test:runner:1.1.0'
        androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
