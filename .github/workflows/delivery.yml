# Delivery workflow for the master branch.
# We execute build stages in separate jobs to prevent artifact duplication.
name: Delivery

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency: ${{ github.ref }}

jobs:
  build-irmagobridge-ios:
    runs-on: macos-15 # MacOS version is pinned, because it determines which XCode version is used.
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - run: bundle exec fastlane ios_build_irmagobridge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: irmagobridge-ios
          path: yivi_core/ios/Irmagobridge.xcframework/
  build-irmagobridge-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - run: bundle exec fastlane android_build_irmagobridge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: irmagobridge-android
          path: yivi_core/android/irmagobridge/irmagobridge.aar
  generate-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      # The licence lookups go over the network. Both bundle jobs need this one,
      # so a lookup that fails once is tried again before it stops a delivery.
      - name: Generate CycloneDX SBOM
        run: |
          for attempt in 1 2 3; do
            if ./generate_sbom.sh ./build/sbom/yivi-app.cdx.json; then
              exit 0
            fi
            echo "::warning::Generating the SBOM failed (attempt $attempt of 3)"
            sleep $((attempt * 20))
          done
          exit 1
        env:
          # Raises the GitHub API rate limit for the licence lookups.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: ./build/sbom/yivi-app.cdx.json
  build-app-ios-alpha:
    # Ad Hoc builds do not require unique build numbers, so we can build this on every push.
    runs-on: macos-15 # MacOS version is pinned, because it determines which XCode version is used.
    needs: build-irmagobridge-ios
    environment: ad-hoc-alpha
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Download irmagobridge artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: irmagobridge-ios
          path: yivi_core/ios/Irmagobridge.xcframework/
      - name: Decode binary environment secrets
        env:
          APPLE_DISTRIBUTION_CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ./fastlane/profiles
          echo "$APPLE_DISTRIBUTION_CERTIFICATE" | base64 --decode > ./fastlane/profiles/apple_distribution.p12
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > ./fastlane/profiles/ad_hoc_alpha.mobileprovision
      - name: Build app
        run: >
          bundle exec fastlane ios_build_app
          flavor:alpha
          code_signing_identity:"iPhone Distribution"
          certificate_path:profiles/apple_distribution.p12
          certificate_password:${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          provisioning_profile_path:profiles/ad_hoc_alpha.mobileprovision
          sentry_dsn:${{ secrets.SENTRY_DSN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-alpha-ios
          path: ./fastlane/build/*.ipa
      # The symbols that make a stack trace of this obfuscated build readable.
      # Kept apart from the app artifacts, so they do not end up in a release.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dart-symbols-alpha-ios
          path: ./fastlane/build/dart-symbols-*.zip
          if-no-files-found: error
      # After the artifact, so the symbols are kept when Sentry cannot be reached.
      - name: Upload Dart symbols to Sentry
        uses: ./.github/actions/upload-dart-symbols
        with:
          auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          org: ${{ vars.SENTRY_ORG }}
          project: ${{ vars.SENTRY_PROJECT }}
          url: ${{ vars.SENTRY_URL }}
  build-app-android-alpha:
    runs-on: ubuntu-latest
    needs: build-irmagobridge-android
    environment: android-alpha
    # For now, we also build the beta flavor using the alpha secrets to enable ad-hoc distribution of the
    # beta flavor Android app. This is needed, because the irma-frontend-packages use the app identifier of the
    # beta flavor Android app in the intent:// links.
    strategy:
      matrix:
        flavor: [alpha, beta]
        type: [apk, appbundle]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      # The Android builds fill up the runner's disk now and then. Our own Android SDK
      # lives in ~/android-sdk, so the preinstalled one can go. The tool cache stays,
      # because setup-java, setup-go and setup-ruby use it.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          sudo docker system prune -af || true
          df -h /
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Download irmagobridge artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: irmagobridge-android
          path: yivi_core/android/irmagobridge/
      - name: Decode binary environment secrets
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
        run: |
          mkdir -p ./fastlane/profiles
          echo "$ANDROID_SIGNING_KEYSTORE" | base64 --decode > ./fastlane/profiles/keystore.jks
      - name: Build app
        run: >
          bundle exec fastlane android_build_${{ matrix.type }}
          flavor:${{ matrix.flavor }}
          sentry_dsn:${{ secrets.SENTRY_DSN }}
          keystore_path:profiles/keystore.jks
          key_alias:android-signing-alpha
          keystore_password:${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          key_password:${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-alpha-android-${{ matrix.flavor }}-${{ matrix.type }}
          path: |
            ./fastlane/build/*.apk
            ./fastlane/build/*.aab
      # The symbols that make a stack trace of this obfuscated build readable.
      # Kept apart from the app artifacts, so they do not end up in a release.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dart-symbols-alpha-android-${{ matrix.flavor }}-${{ matrix.type }}
          path: ./fastlane/build/dart-symbols-*.zip
          if-no-files-found: error
      # After the artifact, so the symbols are kept when Sentry cannot be reached.
      - name: Upload Dart symbols to Sentry
        uses: ./.github/actions/upload-dart-symbols
        with:
          auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          org: ${{ vars.SENTRY_ORG }}
          project: ${{ vars.SENTRY_PROJECT }}
          url: ${{ vars.SENTRY_URL }}
  bundle-app-alpha:
    runs-on: ubuntu-latest
    needs:
      - build-app-ios-alpha
      - build-app-android-alpha
      - generate-sbom
    steps:
      - name: Download sbom artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
      - name: Download app-alpha-ios artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-alpha-ios
      # Check the comment above in the build-app-android-alpha job spec why the beta is also present here.
      - name: Download app-alpha-android-alpha-apk artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-alpha-android-alpha-apk
      - name: Download app-alpha-android-alpha-appbundle artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-alpha-android-alpha-appbundle
      - name: Download app-alpha-android-beta-apk artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-alpha-android-beta-apk
      - name: Download app-alpha-android-beta-appbundle artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-alpha-android-beta-appbundle
      - name: Bundle all artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-bundle-alpha
          path: .
  version-check:
    runs-on: ubuntu-latest
    needs: bundle-app-alpha
    outputs:
      version-changed: ${{ steps.detection.outputs.increased }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # The stores key a release on the build number (the +N suffix) and refuse one
      # they have already seen. So the beta builds, which are uploaded to the stores,
      # only run when that number goes up; a change to only the semver would give a
      # build both stores refuse.
      - name: Detect build number increase
        id: detection
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          build_number() {
            sed -n 's/^version: [0-9]*\.[0-9]*\.[0-9]*+\([0-9]*\)$/\1/p' | head -n1
          }
          before=$(git show "$BEFORE_SHA:yivi_app/pubspec.yaml" 2>/dev/null | build_number)
          after=$(build_number < ./yivi_app/pubspec.yaml)
          echo "before=${before:-<none>} after=${after:-<none>}"

          if [ -z "$after" ]; then
            echo "::error::No build number found in yivi_app/pubspec.yaml"
            exit 1
          fi
          # Without a previous revision (first push, force push) we cannot tell, and
          # guessing wrong would use up a build number, so that counts as no increase.
          if [ -n "$before" ] && [ "$after" -gt "$before" ]; then
            echo "increased=true" >> "$GITHUB_OUTPUT"
          else
            echo "increased=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
  build-app-ios-beta:
    runs-on: macos-15 # MacOS version is pinned, because it determines which XCode version is used.
    needs: version-check
    if: needs.version-check.outputs.version-changed == 'true'
    environment: app-store-beta
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Download irmagobridge artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: irmagobridge-ios
          path: yivi_core/ios/Irmagobridge.xcframework/
      - name: Decode binary environment secrets
        env:
          APPLE_DISTRIBUTION_CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ./fastlane/profiles
          echo "$APPLE_DISTRIBUTION_CERTIFICATE" | base64 --decode > ./fastlane/profiles/apple_distribution.p12
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > ./fastlane/profiles/app_store_beta.mobileprovision
      - name: Build app
        run: >
          bundle exec fastlane ios_build_app
          flavor:beta
          code_signing_identity:"iPhone Distribution"
          certificate_path:profiles/apple_distribution.p12
          certificate_password:${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          provisioning_profile_path:profiles/app_store_beta.mobileprovision
          sentry_dsn:${{ secrets.SENTRY_DSN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-beta-ios
          path: ./fastlane/build/*.ipa
      # The symbols that make a stack trace of this obfuscated build readable.
      # Kept apart from the app artifacts, so they do not end up in a release.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dart-symbols-beta-ios
          path: ./fastlane/build/dart-symbols-*.zip
          if-no-files-found: error
      # After the artifacts, so a refused upload still leaves the IPA and its symbols
      # on the run. Before Sentry, so Sentry being unreachable does not hold up a release.
      - name: Decode App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: echo "$APP_STORE_CONNECT_KEY" | base64 --decode > ./fastlane/profiles/app_store_connect_key.p8
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: >
          bundle exec fastlane ios_upload_testflight
          key_id:"$APP_STORE_CONNECT_KEY_ID"
          issuer_id:"$APP_STORE_CONNECT_ISSUER_ID"
          key_filepath:profiles/app_store_connect_key.p8
      # After the artifact, so the symbols are kept when Sentry cannot be reached.
      - name: Upload Dart symbols to Sentry
        uses: ./.github/actions/upload-dart-symbols
        with:
          auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          org: ${{ vars.SENTRY_ORG }}
          project: ${{ vars.SENTRY_PROJECT }}
          url: ${{ vars.SENTRY_URL }}
  build-app-android-beta:
    # Signed with the upload key that Google Play has registered for this app.
    runs-on: ubuntu-latest
    needs: version-check
    if: needs.version-check.outputs.version-changed == 'true'
    environment: android-beta
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      # The Android builds fill up the runner's disk now and then. Our own Android SDK
      # lives in ~/android-sdk, so the preinstalled one can go. The tool cache stays,
      # because setup-java, setup-go and setup-ruby use it.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          sudo docker system prune -af || true
          df -h /
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Download irmagobridge artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: irmagobridge-android
          path: yivi_core/android/irmagobridge/
      - name: Decode binary environment secrets
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
        run: |
          mkdir -p ./fastlane/profiles
          echo "$ANDROID_SIGNING_KEYSTORE" | base64 --decode > ./fastlane/profiles/keystore.jks
      - name: Build app
        run: >
          bundle exec fastlane android_build_appbundle
          flavor:beta
          sentry_dsn:${{ secrets.SENTRY_DSN }}
          keystore_path:profiles/keystore.jks
          key_alias:android-play-store-upload-key
          keystore_password:${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          key_password:${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-beta-android
          path: |
            ./fastlane/build/*.apk
            ./fastlane/build/*.aab
      # The symbols that make a stack trace of this obfuscated build readable.
      # Kept apart from the app artifacts, so they do not end up in a release.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dart-symbols-beta-android
          path: ./fastlane/build/dart-symbols-*.zip
          if-no-files-found: error
      # See build-app-ios-beta for the order of these steps.
      - name: Decode Google Play service account key
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | base64 --decode > ./fastlane/profiles/play_service_account.json
      - name: Upload to the Play Store internal track
        run: >
          bundle exec fastlane android_upload_play_store
          json_key_path:profiles/play_service_account.json
      # After the artifact, so the symbols are kept when Sentry cannot be reached.
      - name: Upload Dart symbols to Sentry
        uses: ./.github/actions/upload-dart-symbols
        with:
          auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          org: ${{ vars.SENTRY_ORG }}
          project: ${{ vars.SENTRY_PROJECT }}
          url: ${{ vars.SENTRY_URL }}
  bundle-app-beta:
    runs-on: ubuntu-latest
    needs:
      - build-app-ios-beta
      - build-app-android-beta
      - generate-sbom
    steps:
      - name: Download sbom artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
      - name: Download app-beta-ios artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-beta-ios
      - name: Download app-beta-android artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-beta-android
      - name: Bundle all artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-bundle-beta
          path: .
