# Tries the whole store upload path without publishing anything.
#
# The iOS job runs Apple's validation through deliver's verify_only; the Android
# job uses supply's validate_only. Nothing is uploaded and no build number is used,
# so this can run as often as needed: before a release, or after changing the
# certificates, the provisioning profiles or the store credentials.
#
# Kept apart from delivery.yml, so a manual run cannot start the alpha or beta jobs
# there.
name: Distribution dry run

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which store upload path to try
        type: choice
        options: [both, ios, android]
        default: both

permissions:
  contents: read

concurrency: dry-run-${{ github.ref }}

jobs:
  # A manual run cannot download the Go bridge from another run, so it builds it.
  build-irmagobridge-ios:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-15 # MacOS version is pinned, because it determines which XCode version is used.
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - run: bundle exec fastlane ios_build_irmagobridge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: irmagobridge-ios
          path: yivi_core/ios/Irmagobridge.xcframework/
  build-irmagobridge-android:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - run: bundle exec fastlane android_build_irmagobridge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: irmagobridge-android
          path: yivi_core/android/irmagobridge/irmagobridge.aar
  dry-run-ios:
    runs-on: macos-15 # MacOS version is pinned, because it determines which XCode version is used.
    needs: build-irmagobridge-ios
    environment: app-store-beta
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Download irmagobridge artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: irmagobridge-ios
          path: yivi_core/ios/Irmagobridge.xcframework/
      - name: Decode binary environment secrets
        env:
          APPLE_DISTRIBUTION_CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          mkdir -p ./fastlane/profiles
          echo "$APPLE_DISTRIBUTION_CERTIFICATE" | base64 --decode > ./fastlane/profiles/apple_distribution.p12
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > ./fastlane/profiles/app_store_beta.mobileprovision
          echo "$APP_STORE_CONNECT_KEY" | base64 --decode > ./fastlane/profiles/app_store_connect_key.p8
      - name: Build app
        run: >
          bundle exec fastlane ios_build_app
          flavor:beta
          code_signing_identity:"iPhone Distribution"
          certificate_path:profiles/apple_distribution.p12
          certificate_password:${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          provisioning_profile_path:profiles/app_store_beta.mobileprovision
          sentry_dsn:${{ secrets.SENTRY_DSN }}
      - name: Validate with App Store Connect (no upload)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: >
          bundle exec fastlane ios_verify_app_store
          key_id:"$APP_STORE_CONNECT_KEY_ID"
          issuer_id:"$APP_STORE_CONNECT_ISSUER_ID"
          key_filepath:profiles/app_store_connect_key.p8
  dry-run-android:
    runs-on: ubuntu-latest
    needs: build-irmagobridge-android
    environment: android-beta
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      # See build-app-android-beta in delivery.yml.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          sudo docker system prune -af || true
          df -h /
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Download irmagobridge artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: irmagobridge-android
          path: yivi_core/android/irmagobridge/
      - name: Decode binary environment secrets
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p ./fastlane/profiles
          echo "$ANDROID_SIGNING_KEYSTORE" | base64 --decode > ./fastlane/profiles/keystore.jks
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | base64 --decode > ./fastlane/profiles/play_service_account.json
      - name: Build app
        run: >
          bundle exec fastlane android_build_appbundle
          flavor:beta
          sentry_dsn:${{ secrets.SENTRY_DSN }}
          keystore_path:profiles/keystore.jks
          key_alias:android-play-store-upload-key
          keystore_password:${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          key_password:${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
      - name: Validate with Google Play (no upload)
        run: >
          bundle exec fastlane android_upload_play_store
          json_key_path:profiles/play_service_account.json
          validate_only:true
