plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Debug signing of release builds is opt-in for local testing. Compare the value, so that
// -PallowDebugSigning=false opts out; the bare -PallowDebugSigning flag gives an empty string.
def allowDebugSigning = ["", "true"].contains(project.findProperty("allowDebugSigning")?.toString())

android {
    compileSdkVersion 37
    ndkVersion = "28.2.13676358"
    namespace 'foundation.privacybydesign.irmamobile'

    lintOptions {
        disable 'InvalidPackage'
    }

    defaultConfig {
        applicationId "org.irmacard.cardemu"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "track"
    productFlavors {
        alpha {
            dimension "track"
            applicationIdSuffix ".alpha"
        }
        beta {
            dimension "track"
        }
    }

    signingConfigs {
        if (project.hasProperty("keyStoreFile")) {
            release {
                storeFile file(project.property("keyStoreFile"))
                storePassword project.property("keyStorePassword")
                keyAlias project.property("keyAlias")
                keyPassword project.property("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            // R8 shrinks, optimises and renames the Java/Kotlin code and removes unused
            // resources. These are the Flutter Gradle plugin's defaults for a release
            // build; stated here so the release does not depend on them staying so.
            minifyEnabled true
            shrinkResources true

            // Flutter does not support building for x86 in release mode.
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }

            if (project.hasProperty("keyStoreFile")) {
                signingConfig signingConfigs.release
            } else if (allowDebugSigning) {
                // Local testing only: sign the release build with the debug key.
                signingConfig signingConfigs.debug
            }
        }
    }

    bundle {
        // Store archive and code transparency cannot be combined yet.
        // https://stackoverflow.com/questions/74275816/code-verification-error-when-uploading-aab-files-added-after-transparency-meta
        storeArchive {
            enable = false
        }
        if (project.hasProperty("keyStoreFile")) {
            codeTransparency {
                signing {
                    storeFile file(project.property("keyStoreFile"))
                    storePassword project.property("keyStorePassword")
                    keyAlias project.property("keyAlias")
                    keyPassword project.property("keyPassword")
                }
            }
        }
    }
}

// A release build must never silently fall back to the debug key. Fail before building instead,
// unless the release key is given or debug signing is explicitly requested for local testing.
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(assemble|bundle|package)\w*Release/
    }
    if (buildsRelease && !project.hasProperty("keyStoreFile") && !allowDebugSigning) {
        throw new GradleException(
            "Release builds must be signed with the release key. Pass -PkeyStoreFile, -PkeyStorePassword, " +
            "-PkeyAlias and -PkeyPassword, or, for local testing only, -PallowDebugSigning " +
            "(or set ORG_GRADLE_PROJECT_allowDebugSigning=true) to sign with the debug key."
        )
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.browser:browser:1.2.0"
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.1.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'

    implementation "com.google.mlkit:text-recognition:16.0.0"
    implementation "com.google.mlkit:text-recognition-chinese:16.0.0"
    implementation "com.google.mlkit:text-recognition-devanagari:16.0.0"
    implementation "com.google.mlkit:text-recognition-japanese:16.0.0"
    implementation "com.google.mlkit:text-recognition-korean:16.0.0"
}
